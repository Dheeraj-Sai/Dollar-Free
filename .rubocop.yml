AllCops:
  NewCops: enable
  TargetRubyVersion: 2.6


Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/FrozenStringLiteralComment:
  Enabled: false

Style/RedundantReturn:
  Enabled: false

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 25

Metrics/ClassLength:
  Max: 220

Metrics/BlockLength:
  Exclude:
    - "test/**/*"

Naming/PredicateMethod:
  Exclude:
    - "lib/main_menu.rb"

Metrics/CyclomaticComplexity:
  Max: 12
